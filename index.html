
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>notes-editor</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; }
    header { padding: 12px 16px; background: #1f2937; color: #fff; }
    .tabs { display: none; }
    .app { display: flex; height: calc(100vh - 48px); }
    .list { width: 280px; border-right: 1px solid #ccc; padding: 12px; overflow-y: auto; }
    .editor { flex: 1; padding: 12px; }
    .editor textarea { width: 100%; height: 100%; font-size: 16px; padding: 8px; }
    @media (max-width: 600px) {
      .tabs { display: flex; }
      .tabs button { flex: 1; padding: 12px; font-size: 16px; }
      .app { height: auto; }
      .list, .editor { display: none; width: 100%; border: none; }
      .editor textarea { height: 60vh; }
      .app.show-list .list { display: block; }
      .app.show-editor .editor { display: block; }
    }
  </style>
</head>
<body>
  <header><strong>notes-editor</strong></header>
  <div class="tabs">
    <button onclick="show('list')">Заметки</button>
    <button onclick="show('editor')">Редактор</button>
  </div>
  <div class="app show-list" id="app">
    <aside class="list">
      <h2>Заметки</h2>
      <p>Здесь будет список заметок.</p>
    </aside>
    <main class="editor">
      <textarea placeholder="Начни писать заметку..."></textarea>
    </main>
  </div>
  <script>
    var app = document.getElementById('app');
    function show(name) {
      app.className = 'app show-' + name;
    }
  </script>
</body>
</html>
