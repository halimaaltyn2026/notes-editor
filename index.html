
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>notes-editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><strong>notes-editor</strong></header>
  <div class="tabs">
    <button onclick="show('list')">Заметки</button>
    <button onclick="show('editor')">Редактор</button>
  </div>
  <div class="app show-list" id="app">
    <aside class="list">
      <button class="new-btn" onclick="createNote()">+ Новая заметка</button>
      <ul id="notes"></ul>
    </aside>
    <main class="editor">
      <textarea id="text" placeholder="Создай заметку, чтобы начать" disabled></textarea>
      <button class="del-btn" id="del" onclick="deleteNote()" disabled>Удалить заметку</button>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
